<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Man's Best Friend</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css?v=2026-10-18">
<style>
  body{background:#F6F3EE}
  .ad{max-width:1100px;margin:0 auto;padding:32px 20px 80px}
  .ad-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .ad-top h1{font-size:1.9rem;margin:0}
  .ad-top .sub{color:var(--muted);margin:4px 0 0}
  .ad-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ad-controls button{font:inherit;font-weight:700;font-size:.9rem;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
  .ad-controls button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .ad-login{max-width:420px;margin:12vh auto 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px}
  .ad-login h1{font-size:1.6rem;margin-bottom:6px}
  .ad-login p{color:var(--muted);margin-bottom:20px}
  .ad-login .row{margin-bottom:14px}
  .ad-login button{width:100%}
  .ad-err{margin:0 0 12px;padding:10px 14px;border-radius:10px;background:#FDECEC;color:#9B1C1C;font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
  .card-k{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
  .card-k span{display:block;color:var(--muted);font-size:.88rem;font-weight:600}
  .card-k strong{display:block;font-size:1.9rem;color:var(--navy);margin-top:4px;font-variant-numeric:tabular-nums}
  .panel-w{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px}
  .panel-w h2{font-size:1.1rem;margin:0 0 14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .chart{display:flex;align-items:flex-end;gap:3px;height:160px;padding-top:8px}
  .chart .bar{flex:1;min-width:3px;background:var(--gold);border-radius:4px 4px 0 0;position:relative}
  .chart .bar:hover{background:var(--navy)}
  .chart-x{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:6px}
  .rows{list-style:none;margin:0;padding:0}
  .rows li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-top:1px solid #F0EAE0;position:relative}
  .rows li:first-child{border-top:0}
  .rows li .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:1}
  .rows li .num{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;position:relative;z-index:1}
  .rows li .fill{position:absolute;left:0;top:4px;bottom:4px;background:#F4E7D4;border-radius:6px;z-index:0}
  .feed{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
  .feed li{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:8px 0;border-top:1px solid #F0EAE0;font-size:.95rem}
  .feed li:first-child{border-top:0}
  .feed time{color:var(--muted);font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:6px}
  .tag.pv{background:#E8EEF5;color:var(--navy)}.tag.ck{background:#F4E7D4;color:#8A5A1F}
  .empty{color:var(--muted)}
  @media (max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.feed li{grid-template-columns:1fr}}
</style>
</head>
<body>

<section class="ad-login" id="login" hidden>
  <h1>Admin sign in</h1>
  <p>Man's Best Friend website traffic.</p>
  <form id="login-form" novalidate>
    <p class="ad-err" id="login-err" role="alert" hidden></p>
    <div class="row"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="row"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary" type="submit" id="login-btn">Sign in</button>
  </form>
</section>

<main class="ad" id="dash" hidden>
  <div class="ad-top">
    <div><h1>Website traffic</h1><p class="sub" id="range-label">Last 30 days</p></div>
    <div class="ad-controls">
      <button type="button" data-days="7">7 days</button>
      <button type="button" data-days="30" aria-pressed="true">30 days</button>
      <button type="button" data-days="90">90 days</button>
      <button type="button" id="logout">Sign out</button>
    </div>
  </div>
  <div class="cards">
    <div class="card-k"><span>Visitors</span><strong id="k-visitors">0</strong></div>
    <div class="card-k"><span>Page views</span><strong id="k-views">0</strong></div>
    <div class="card-k"><span>Call clicks</span><strong id="k-calls">0</strong></div>
    <div class="card-k"><span>Text clicks</span><strong id="k-texts">0</strong></div>
    <div class="card-k"><span>All clicks</span><strong id="k-clicks">0</strong></div>
  </div>
  <div class="panel-w"><h2>Visitors per day</h2><div class="chart" id="chart"></div><div class="chart-x"><span id="x-start"></span><span id="x-end"></span></div></div>
  <div class="two">
    <div class="panel-w"><h2>Where visitors came from</h2><ul class="rows" id="sources"></ul></div>
    <div class="panel-w"><h2>What they clicked</h2><ul class="rows" id="clicks"></ul></div>
  </div>
  <div class="two">
    <div class="panel-w"><h2>Top pages</h2><ul class="rows" id="pages"></ul></div>
    <div class="panel-w"><h2>Devices</h2><ul class="rows" id="devices"></ul></div>
  </div>
  <div class="panel-w"><h2>Recent activity</h2><ul class="feed" id="feed"></ul></div>
</main>

<script>
(function () {
  var days = 30;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function api(action, opts) { return fetch('/api/admin?action=' + action + (opts && opts.q ? '&' + opts.q : ''), Object.assign({ credentials: 'same-origin' }, opts || {})); }

  function show(signedIn) { $('login').hidden = signedIn; $('dash').hidden = !signedIn; if (signedIn) load(); }

  function sum(rows, key) { var out = {}; rows.forEach(function (r) { Object.keys(r[key] || {}).forEach(function (k) { out[k] = (out[k] || 0) + r[key][k]; }); }); return out; }
  function renderRows(id, obj, emptyText) {
    var ul = $(id); ul.innerHTML = '';
    var entries = Object.keys(obj).map(function (k) { return [k, obj[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 12);
    if (!entries.length) { ul.appendChild(el('li', 'empty', emptyText)); return; }
    var max = entries[0][1];
    entries.forEach(function (e) {
      var li = el('li'); var fill = el('span', 'fill'); fill.style.width = Math.max(4, (e[1] / max) * 100) + '%';
      li.appendChild(fill); li.appendChild(el('span', 'lbl', e[0])); li.appendChild(el('span', 'num', e[1])); ul.appendChild(li);
    });
  }

  function render(data) {
    var rows = data.rows || [];
    var byDate = {}; rows.forEach(function (r) { byDate[r.date] = r; });
    var dates = []; for (var i = days - 1; i >= 0; i--) dates.push(new Date(Date.now() - i * 864e5).toISOString().slice(0, 10));
    var visitors = 0, views = 0; rows.forEach(function (r) { visitors += r.visitors; views += r.pageviews; });
    var clicks = sum(rows, 'clicks'); var totalClicks = Object.keys(clicks).reduce(function (a, k) { return a + clicks[k]; }, 0);
    $('k-visitors').textContent = visitors; $('k-views').textContent = views;
    $('k-calls').textContent = clicks['Call'] || 0; $('k-texts').textContent = clicks['Text'] || 0; $('k-clicks').textContent = totalClicks;
    $('range-label').textContent = 'Last ' + days + ' days';

    var chart = $('chart'); chart.innerHTML = '';
    var max = Math.max(1, Math.max.apply(null, dates.map(function (d) { return byDate[d] ? byDate[d].visitors : 0; })));
    dates.forEach(function (d) {
      var v = byDate[d] ? byDate[d].visitors : 0;
      var b = el('div', 'bar'); b.style.height = Math.max(2, (v / max) * 100) + '%'; b.title = d + ': ' + v + ' visitor' + (v === 1 ? '' : 's'); chart.appendChild(b);
    });
    $('x-start').textContent = dates[0]; $('x-end').textContent = 'Today';

    renderRows('sources', sum(rows, 'sources'), 'No visits yet.');
    renderRows('clicks', clicks, 'No clicks yet.');
    renderRows('pages', sum(rows, 'pages'), 'No visits yet.');
    renderRows('devices', sum(rows, 'devices'), 'No visits yet.');

    var feed = $('feed'); feed.innerHTML = '';
    var recent = []; rows.forEach(function (r) { recent = recent.concat(r.recent || []); });
    recent.sort(function (a, b) { return a.ts < b.ts ? 1 : -1; });
    if (!recent.length) feed.appendChild(el('li', 'empty', 'Nothing yet. Activity appears here as people visit the site.'));
    recent.slice(0, 120).forEach(function (ev) {
      var li = el('li'); li.appendChild(el('time', null, new Date(ev.ts).toLocaleString()));
      var what = el('span'); what.appendChild(el('span', 'tag ' + (ev.type === 'click' ? 'ck' : 'pv'), ev.type === 'click' ? 'Click' : 'Visit'));
      what.appendChild(document.createTextNode(ev.type === 'click' ? ev.label + ' on ' + ev.path : ev.path + ' from ' + ev.source + ' (' + ev.device + ')'));
      li.appendChild(what); feed.appendChild(li);
    });
  }

  function load() {
    api('stats', { q: 'days=' + days }).then(function (r) { if (r.status === 401) { show(false); return null; } return r.json(); })
      .then(function (j) { if (j) render(j); }).catch(function () {});
  }

  document.querySelectorAll('[data-days]').forEach(function (b) {
    b.addEventListener('click', function () {
      days = Number(b.dataset.days);
      document.querySelectorAll('[data-days]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      load();
    });
  });
  $('logout').addEventListener('click', function () { api('logout', { method: 'POST' }).then(function () { show(false); }); });
  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault(); var err = $('login-err'); err.hidden = true; var btn = $('login-btn'); btn.disabled = true; btn.textContent = 'Signing in…';
    api('login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('em').value, password: $('pw').value }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) { btn.disabled = false; btn.textContent = 'Sign in'; if (!x.ok) { err.textContent = x.j.error || 'Sign in failed.'; err.hidden = false; return; } $('pw').value = ''; show(true); })
      .catch(function () { btn.disabled = false; btn.textContent = 'Sign in'; err.textContent = 'Could not connect.'; err.hidden = false; });
  });
  api('session').then(function (r) { return r.json(); }).then(function (j) { show(!!j.signedIn); }).catch(function () { show(false); });
})();
</script>
</body>
</html>
